05.0" stroke="#eef2f7" stroke-width="1"  /><line x1="460.0" y1="430.0" x2="460.0" y2="105.0" stroke="#eef2f7" stroke-width="1"  /><line x1="510.0" y1="430.0" x2="510.0" y2="105.0" stroke="#eef2f7" stroke-width="1"  /><line x1="560.0" y1="430.0" x2="560.0" y2="105.0" stroke="#eef2f7" stroke-width="1"  /><line x1="110.0" y1="430.0" x2="585.0" y2="430.0" stroke="#eef2f7" stroke-width="1"  /><line x1="110.0" y1="380.0" x2="585.0" y2="380.0" stroke="#eef2f7" stroke-width="1"  /><line x1="110.0" y1="330.0" x2="585.0" y2="330.0" stroke="#eef2f7" stroke-width="1"  /><line x1="110.0" y1="280.0" x2="585.0" y2="280.0" stroke="#eef2f7" stroke-width="1"  /><line x1="110.0" y1="230.0" x2="585.0" y2="230.0" stroke="#eef2f7" stroke-width="1"  /><line x1="110.0" y1="180.0" x2="585.0" y2="180.0" stroke="#eef2f7" stroke-width="1"  /><line x1="110.0" y1="130.0" x2="585.0" y2="130.0" stroke="#eef2f7" stroke-width="1"  /><line x1="110.0" y1="430.0" x2="590.0" y2="430.0" stroke="#6b7280" stroke-width="1.2" marker-end="url(#ahm)" /><line x1="110.0" y1="430.0" x2="110.0" y2="100.0" stroke="#6b7280" stroke-width="1.2" marker-end="url(#ahm)" /><line x1="110.0" y1="430.0" x2="350.0" y2="110.0" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#ahp)" stroke-dasharray="7 5" opacity="0.7"/><text x="357.5" y="112.5" font-size="13" fill="#7c3aed" text-anchor="start" font-weight="600" >c = (6, 8) direction, same as a</text><line x1="110.0" y1="430.0" x2="260.0" y2="230.0" stroke="#2563eb" stroke-width="3" marker-end="url(#ah)" /><text x="248.0" y="222.0" font-size="15" fill="#2563eb" text-anchor="end" font-weight="700" >a = (3, 4)</text><line x1="110.0" y1="430.0" x2="310.0" y2="430.0" stroke="#0f9d8c" stroke-width="3" marker-end="url(#aht)" /><text x="324.0" y="420.0" font-size="15" fill="#0f9d8c" text-anchor="start" font-weight="700" >b = (4, 0)</text><line x1="260.0" y1="230.0" x2="260.0" y2="430.0" stroke="#ea580c" stroke-width="1.8"  stroke-dasharray="5 4"/><line x1="110.0" y1="424.0" x2="260.0" y2="424.0" stroke="#ea580c" stroke-width="5"  opacity="0.75"/><text x="185.0" y="454.0" font-size="13" fill="#ea580c" text-anchor="middle" font-weight="700" >projection = (3, 0)</text><rect x="248.0" y="418.0" width="12.0" height="12.0" rx="0" fill="none" stroke="#ea580c" stroke-width="1.2" /><path d="M156,430 A46,46 0 0 0 137.6,393.2" stroke="#1f2937" stroke-width="1.6" fill="none"  /><text x="160.0" y="416.0" font-size="15" fill="#1f2937" text-anchor="start" font-weight="700" >θ</text><text x="600.0" y="110.0" font-size="15" fill="#2563eb" text-anchor="start" font-weight="500" >‖a‖ = √(3² + 4²) = 5</text><text x="600.0" y="142.0" font-size="15" fill="#0f9d8c" text-anchor="start" font-weight="500" >‖b‖ = 4</text><text x="600.0" y="174.0" font-size="15" fill="#1f2937" text-anchor="start" font-weight="700" >a · b = 3·4 + 4·0 = 12</text><text x="600.0" y="206.0" font-size="15" fill="#1f2937" text-anchor="start" font-weight="500" >cos θ = 12 / (5·4) = 0.6</text><text x="600.0" y="238.0" font-size="15" fill="#1f2937" text-anchor="start" font-weight="500" >θ ≈ 53.13°</text><text x="600.0" y="270.0" font-size="15" fill="#ea580c" text-anchor="start" font-weight="700" >scalar projection = 12 / 4 = 3</text><text x="600.0" y="302.0" font-size="15" fill="#ea580c" text-anchor="start" font-weight="500" >vector projection = (12/16)·b = (3, 0)</text><text x="600.0" y="334.0" font-size="15" fill="#7c3aed" text-anchor="start" font-weight="700" >cos-similarity(a, c) = 50 / (5·10) = 1</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
