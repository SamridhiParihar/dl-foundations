<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 420" width="1180" height="420" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="aho" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="aht" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f9d8c"/></marker></defs><rect x="0.5" y="0.5" width="1179" height="419" rx="14" fill="#ffffff" stroke="#e5e7eb"/><text x="24.0" y="34.0" font-size="19" fill="#1f2937" text-anchor="start" font-weight="700" >One training step: forward pass, then backward pass</text><rect x="40.0" y="110.0" width="70.0" height="46.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6" /><text x="75.0" y="138.0" font-size="13.5" fill="#2563eb" text-anchor="middle" font-weight="700" >X</text><line x1="114.0" y1="133.0" x2="226.0" y2="133.0" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ah)" /><rect x="230.0" y="110.0" width="160.0" height="46.0" rx="8" fill="#ccf1ec" stroke="#0f9d8c" stroke-width="1.6" /><text x="310.0" y="138.0" font-size="13.5" fill="#0f9d8c" text-anchor="middle" font-weight="700" >Z1 = X@W1 + b1</text><line x1="394.0" y1="133.0" x2="416.0" y2="133.0" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ah)" /><rect x="420.0" y="110.0" width="160.0" height="46.0" rx="8" fill="#ccf1ec" stroke="#0f9d8c" stroke-width="1.6" /><text x="500.0" y="138.0" font-size="13.5" fill="#0f9d8c" text-anchor="middle" font-weight="700" >A1 = ReLU(Z1)</text><line x1="584.0" y1="133.0" x2="606.0" y2="133.0" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ah)" /><rect x="610.0" y="110.0" width="160.0" height="46.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6" /><text x="690.0" y="138.0" font-size="13.5" fill="#7c3aed" text-anchor="middle" font-weight="700" >Z2 = A1@W2 + b2</text><line x1="774.0" y1="133.0" x2="796.0" y2="133.0" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ah)" /><rect x="800.0" y="110.0" width="160.0" height="46.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6" /><text x="880.0" y="138.0" font-size="13.5" fill="#7c3aed" text-anchor="middle" font-weight="700" >A2 = σ(Z2)</text><line x1="964.0" y1="133.0" x2="986.0" y2="133.0" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ah)" /><rect x="990.0" y="110.0" width="160.0" height="46.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6" /><text x="1070.0" y="138.0" font-size="13.5" fill="#dc2626" text-anchor="middle" font-weight="700" >L = BCE(A2, Y)</text><text x="40.0" y="92.0" font-size="14" fill="#1f2937" text-anchor="start" font-weight="700" >FORWARD  →  compute and cache Z1, A1, Z2, A2</text><rect x="40.0" y="250.0" width="170.0" height="56.0" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6" /><text x="125.0" y="274.0" font-size="13" fill="#ea580c" text-anchor="middle" font-weight="700" >dW1 = Xᵀ @ dZ1</text><text x="125.0" y="293.0" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="400" >db1 = Σ dZ1</text><rect x="230.0" y="250.0" width="170.0" height="56.0" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6" /><text x="315.0" y="274.0" font-size="13" fill="#ea580c" text-anchor="middle" font-weight="700" >dZ1 = dA1 ⊙ (Z1 &gt; 0)</text><text x="315.0" y="293.0" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="400" >ReLU mask: 1 or 0</text><line x1="226.0" y1="278.0" x2="214.0" y2="278.0" stroke="#ea580c" stroke-width="1.6" marker-end="url(#aho)" /><rect x="420.0" y="250.0" width="170.0" height="56.0" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6" /><text x="505.0" y="274.0" font-size="13" fill="#ea580c" text-anchor="middle" font-weight="700" >dA1 = dZ2 @ W2ᵀ</text><text x="505.0" y="293.0" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="400" >send back through W2</text><line x1="416.0" y1="278.0" x2="404.0" y2="278.0" stroke="#ea580c" stroke-width="1.6" marker-end="url(#aho)" /><rect x="610.0" y="250.0" width="170.0" height="56.0" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6" /><text x="695.0" y="274.0" font-size="13" fill="#ea580c" text-anchor="middle" font-weight="700" >dW2 = A1ᵀ @ dZ2</text><text x="695.0" y="293.0" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="400" >db2 = Σ dZ2</text><line x1="606.0" y1="278.0" x2="594.0" y2="278.0" stroke="#ea580c" stroke-width="1.6" marker-end="url(#aho)" /><rect x="800.0" y="250.0" width="170.0" height="56.0" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6" /><text x="885.0" y="274.0" font-size="13" fill="#ea580c" text-anchor="middle" font-weight="700" >dZ2 = (A2 − Y) / N</text><text x="885.0" y="293.0" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="400" >σ + BCE simplify</text><line x1="796.0" y1="278.0" x2="784.0" y2="278.0" stroke="#ea580c" stroke-width="1.6" marker-end="url(#aho)" /><rect x="990.0" y="250.0" width="170.0" height="56.0" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6" /><text x="1075.0" y="274.0" font-size="13" fill="#ea580c" text-anchor="middle" font-weight="700" >dL/dL = 1</text><text x="1075.0" y="293.0" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="400" >start here</text><line x1="986.0" y1="278.0" x2="974.0" y2="278.0" stroke="#ea580c" stroke-width="1.6" marker-end="url(#aho)" /><text x="40.0" y="232.0" font-size="14" fill="#ea580c" text-anchor="start" font-weight="700" >BACKWARD  ←  chain rule, using the cache</text><text x="590.0" y="380.0" font-size="13.5" fill="#6b7280" text-anchor="middle" font-weight="400" >Each gradient has the same shape as its parameter: dW1 (2, 8), db1 (1, 8), dW2 (8, 1), db2 (1, 1).</text><text x="590.0" y="402.0" font-size="13.5" fill="#1f2937" text-anchor="middle" font-weight="600" >Then gradient descent: every parameter θ ← θ − 0.1 · dθ</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
