<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" width="1040" height="470" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="aho" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="aht" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f9d8c"/></marker></defs><rect x="0.5" y="0.5" width="1039" height="469" rx="14" fill="#ffffff" stroke="#e5e7eb"/><text x="24.0" y="34.0" font-size="19" fill="#1f2937" text-anchor="start" font-weight="700" >Transfer learning: three strategies</text><text x="30.0" y="104.0" font-size="15.5" fill="#1f2937" text-anchor="start" font-weight="700" >1. Little data, similar to ImageNet</text><text x="30.0" y="124.0" font-size="13" fill="#6b7280" text-anchor="start" font-weight="400" >freeze everything, train only the new head</text><rect x="30.0" y="138.0" width="110.0" height="44.0" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.6" /><text x="85.0" y="165.0" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700" >conv 1</text><path d="M120,148 L120,142 A6,6 0 0 1 132,142 L132,148" stroke="#6b7280" stroke-width="2" fill="none"  /><rect x="117.0" y="148.0" width="18.0" height="13.0" rx="2" fill="#6b7280" stroke="#6b7280" stroke-width="1" /><line x1="142.0" y1="160.0" x2="156.0" y2="160.0" stroke="#1f2937" stroke-width="1.2"  /><rect x="158.0" y="138.0" width="110.0" height="44.0" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.6" /><text x="213.0" y="165.0" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700" >conv 2</text><path d="M248,148 L248,142 A6,6 0 0 1 260,142 L260,148" stroke="#6b7280" stroke-width="2" fill="none"  /><rect x="245.0" y="148.0" width="18.0" height="13.0" rx="2" fill="#6b7280" stroke="#6b7280" stroke-width="1" /><line x1="270.0" y1="160.0" x2="284.0" y2="160.0" stroke="#1f2937" stroke-width="1.2"  /><rect x="286.0" y="138.0" width="110.0" height="44.0" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.6" /><text x="341.0" y="165.0" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700" >conv 3</text><path d="M376,148 L376,142 A6,6 0 0 1 388,142 L388,148" stroke="#6b7280" stroke-width="2" fill="none"  /><rect x="373.0" y="148.0" width="18.0" height="13.0" rx="2" fill="#6b7280" stroke="#6b7280" stroke-width="1" /><line x1="398.0" y1="160.0" x2="412.0" y2="160.0" stroke="#1f2937" stroke-width="1.2"  /><rect x="414.0" y="138.0" width="110.0" height="44.0" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.6" /><text x="469.0" y="165.0" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700" >conv 4</text><path d="M504,148 L504,142 A6,6 0 0 1 516,142 L516,148" stroke="#6b7280" stroke-width="2" fill="none"  /><rect x="501.0" y="148.0" width="18.0" height="13.0" rx="2" fill="#6b7280" stroke="#6b7280" stroke-width="1" /><line x1="526.0" y1="160.0" x2="540.0" y2="160.0" stroke="#1f2937" stroke-width="1.2"  /><rect x="542.0" y="138.0" width="110.0" height="44.0" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.6" /><text x="597.0" y="165.0" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700" >conv 5</text><path d="M632,148 L632,142 A6,6 0 0 1 644,142 L644,148" stroke="#6b7280" stroke-width="2" fill="none"  /><rect x="629.0" y="148.0" width="18.0" height="13.0" rx="2" fill="#6b7280" stroke="#6b7280" stroke-width="1" /><line x1="654.0" y1="160.0" x2="668.0" y2="160.0" stroke="#1f2937" stroke-width="1.2"  /><rect x="670.0" y="138.0" width="110.0" height="44.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6" /><text x="725.0" y="165.0" font-size="14" fill="#7c3aed" text-anchor="middle" font-weight="700" >new FC</text><text x="30.0" y="222.0" font-size="15.5" fill="#1f2937" text-anchor="start" font-weight="700" >2. More data, similar to ImageNet</text><text x="30.0" y="242.0" font-size="13" fill="#6b7280" text-anchor="start" font-weight="400" >start from pre-trained weights, train everything with a small learning rate</text><rect x="30.0" y="256.0" width="110.0" height="44.0" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6" /><text x="85.0" y="283.0" font-size="14" fill="#ea580c" text-anchor="middle" font-weight="700" >conv 1</text><line x1="142.0" y1="278.0" x2="156.0" y2="278.0" stroke="#1f2937" stroke-width="1.2"  /><rect x="158.0" y="256.0" width="110.0" height="44.0" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6" /><text x="213.0" y="283.0" font-size="14" fill="#ea580c" text-anchor="middle" font-weight="700" >conv 2</text><line x1="270.0" y1="278.0" x2="284.0" y2="278.0" stroke="#1f2937" stroke-width="1.2"  /><rect x="286.0" y="256.0" width="110.0" height="44.0" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6" /><text x="341.0" y="283.0" font-size="14" fill="#ea580c" text-anchor="middle" font-weight="700" >conv 3</text><line x1="398.0" y1="278.0" x2="412.0" y2="278.0" stroke="#1f2937" stroke-width="1.2"  /><rect x="414.0" y="256.0" width="110.0" height="44.0" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6" /><text x="469.0" y="283.0" font-size="14" fill="#ea580c" text-anchor="middle" font-weight="700" >conv 4</text><line x1="526.0" y1="278.0" x2="540.0" y2="278.0" stroke="#1f2937" stroke-width="1.2"  /><rect x="542.0" y="256.0" width="110.0" height="44.0" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6" /><text x="597.0" y="283.0" font-size="14" fill="#ea580c" text-anchor="middle" font-weight="700" >conv 5</text><line x1="654.0" y1="278.0" x2="668.0" y2="278.0" stroke="#1f2937" stroke-width="1.2"  /><rect x="670.0" y="256.0" width="110.0" height="44.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6" /><text x="725.0" y="283.0" font-size="14" fill="#7c3aed" text-anchor="middle" font-weight="700" >new FC</text><text x="30.0" y="340.0" font-size="15.5" fill="#1f2937" text-anchor="start" font-weight="700" >3. Very different data (Mars, MRI…)</text><text x="30.0" y="360.0" font-size="13" fill="#6b7280" text-anchor="start" font-weight="400" >lots of data: train from scratch • little data: find a model pre-trained on closer data</text><rect x="30.0" y="374.0" width="110.0" height="44.0" rx="8" fill="#ccf1ec" stroke="#0f9d8c" stroke-width="1.6" /><text x="85.0" y="401.0" font-size="14" fill="#0f9d8c" text-anchor="middle" font-weight="700" >conv 1</text><line x1="142.0" y1="396.0" x2="156.0" y2="396.0" stroke="#1f2937" stroke-width="1.2"  /><rect x="158.0" y="374.0" width="110.0" height="44.0" rx="8" fill="#ccf1ec" stroke="#0f9d8c" stroke-width="1.6" /><text x="213.0" y="401.0" font-size="14" fill="#0f9d8c" text-anchor="middle" font-weight="700" >conv 2</text><line x1="270.0" y1="396.0" x2="284.0" y2="396.0" stroke="#1f2937" stroke-width="1.2"  /><rect x="286.0" y="374.0" width="110.0" height="44.0" rx="8" fill="#ccf1ec" stroke="#0f9d8c" stroke-width="1.6" /><text x="341.0" y="401.0" font-size="14" fill="#0f9d8c" text-anchor="middle" font-weight="700" >conv 3</text><line x1="398.0" y1="396.0" x2="412.0" y2="396.0" stroke="#1f2937" stroke-width="1.2"  /><rect x="414.0" y="374.0" width="110.0" height="44.0" rx="8" fill="#ccf1ec" stroke="#0f9d8c" stroke-width="1.6" /><text x="469.0" y="401.0" font-size="14" fill="#0f9d8c" text-anchor="middle" font-weight="700" >conv 4</text><line x1="526.0" y1="396.0" x2="540.0" y2="396.0" stroke="#1f2937" stroke-width="1.2"  /><rect x="542.0" y="374.0" width="110.0" height="44.0" rx="8" fill="#ccf1ec" stroke="#0f9d8c" stroke-width="1.6" /><text x="597.0" y="401.0" font-size="14" fill="#0f9d8c" text-anchor="middle" font-weight="700" >conv 5</text><line x1="654.0" y1="396.0" x2="668.0" y2="396.0" stroke="#1f2937" stroke-width="1.2"  /><rect x="670.0" y="374.0" width="110.0" height="44.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6" /><text x="725.0" y="401.0" font-size="14" fill="#7c3aed" text-anchor="middle" font-weight="700" >new FC</text><rect x="820.0" y="117.0" width="20.0" height="20.0" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4" /><text x="850.0" y="132.0" font-size="12.5" fill="#1f2937" text-anchor="start" font-weight="400" >frozen (weights not updated)</text><rect x="820.0" y="153.0" width="20.0" height="20.0" rx="4" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4" /><text x="850.0" y="168.0" font-size="12.5" fill="#1f2937" text-anchor="start" font-weight="400" >pre-trained, updated slowly</text><rect x="820.0" y="189.0" width="20.0" height="20.0" rx="4" fill="#ccf1ec" stroke="#0f9d8c" stroke-width="1.4" /><text x="850.0" y="204.0" font-size="12.5" fill="#1f2937" text-anchor="start" font-weight="400" >random init, trained fully</text><rect x="820.0" y="225.0" width="20.0" height="20.0" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4" /><text x="850.0" y="240.0" font-size="12.5" fill="#1f2937" text-anchor="start" font-weight="400" >new layer: your classes</text><text x="520.0" y="450.0" font-size="13.5" fill="#6b7280" text-anchor="middle" font-weight="400" >Early layers learn universal things (edges, textures), so they transfer well; the last layer is always replaced.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
