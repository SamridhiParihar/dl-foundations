"290.0" y="135.0" font-size="14" fill="#0f9d8c" text-anchor="middle" font-weight="700" >3×3 conv, stride 2, 128</text><text x="290.0" y="154.0" font-size="12.5" fill="#6b7280" text-anchor="middle" font-weight="400" >→ 128 × 28 × 28</text><line x1="387.0" y1="139.0" x2="420.0" y2="139.0" stroke="#1f2937" stroke-width="1.4" marker-end="url(#ah)" /><rect x="424.0" y="112.0" width="190.0" height="54.0" rx="8" fill="#ccf1ec" stroke="#0f9d8c" stroke-width="1.6" /><text x="519.0" y="135.0" font-size="14" fill="#0f9d8c" text-anchor="middle" font-weight="700" >3×3 conv, stride 1, 128</text><text x="519.0" y="154.0" font-size="12.5" fill="#6b7280" text-anchor="middle" font-weight="400" >→ 128 × 28 × 28</text><text x="520.0" y="92.0" font-size="13.5" fill="#0f9d8c" text-anchor="middle" font-weight="700" >main path  F(x)</text><rect x="195.0" y="244.0" width="190.0" height="54.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6" /><text x="290.0" y="267.0" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="700" >1×1 conv, stride 2, 128</text><text x="290.0" y="286.0" font-size="12.5" fill="#6b7280" text-anchor="middle" font-weight="400" >→ 128 × 28 × 28</text><text x="290.0" y="320.0" font-size="13.5" fill="#2563eb" text-anchor="middle" font-weight="700" >skip path: a cheap 1×1 conv fixes the shape</text><line x1="616.0" y1="139.0" x2="690.0" y2="190.0" stroke="#1f2937" stroke-width="1.4" marker-end="url(#ah)" /><line x1="387.0" y1="271.0" x2="690.0" y2="210.0" stroke="#1f2937" stroke-width="1.4" marker-end="url(#ah)" /><circle cx="706.0" cy="200.0" r="17" fill="#fff" stroke="#1f2937" stroke-width="2" /><text x="706.0" y="207.0" font-size="22" fill="#1f2937" text-anchor="middle" font-weight="700" >+</text><line x1="724.0" y1="200.0" x2="770.0" y2="200.0" stroke="#1f2937" stroke-width="1.4" marker-end="url(#ah)" /><text x="830.0" y="196.0" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="700" >128 × 28 × 28</text><text x="450.0" y="358.0" font