 i sin θ</text><text x="480.0" y="228.0" font-size="15" fill="#1f2937" text-anchor="start" font-weight="400">As θ grows, e<tspan dy="-6.3" font-size="10.8">iθ</tspan><tspan dy="6.3"> </tspan> walks around</text><text x="480.0" y="250.0" font-size="15" fill="#1f2937" text-anchor="start" font-weight="400" >the unit circle (radius 1).</text><text x="480.0" y="290.0" font-size="15" fill="#2563eb" text-anchor="start" font-weight="600" >Horizontal shadow = cos θ</text><text x="480.0" y="312.0" font-size="15" fill="#ea580c" text-anchor="start" font-weight="600" >Vertical shadow = sin θ</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
